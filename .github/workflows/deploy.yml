name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build immutable API image
        run: >-
          gcloud builds submit .
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --config=infra/cloudbuild-api.yaml
          --gcs-source-staging-dir=gs://${{ secrets.GCP_PROJECT_ID }}-avs-build-source/source
          --substitutions=_IMAGE=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/api:${{ github.sha }}
      - name: Build immutable web image
        run: >-
          gcloud builds submit .
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --config=infra/cloudbuild-web.yaml
          --gcs-source-staging-dir=gs://${{ secrets.GCP_PROJECT_ID }}-avs-build-source/source
          --substitutions=_IMAGE=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/web:${{ github.sha }}
      - name: Deploy API and run migrations
        run: >-
          gcloud run deploy agentic-video-studio-api
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --region=us-central1
          --no-invoker-iam-check
          --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/api:${{ github.sha }}
          --update-env-vars='APP_ENV=production,APP_AUTH_MODE=jwt,PROVIDER_MODE=live,EMAIL_DELIVERY_MODE=sendpulse,EMAIL_FROM_NAME=Framewise,EMAIL_FROM_EMAIL=hello@subschool.us,SENDPULSE_TEMPLATE_ID=266399,SENDPULSE_TEMPLATE_NAME=subschool_main,BOOTSTRAP_ADMIN_EMAIL=maksim@subschool.us,BOOTSTRAP_ADMIN_NAME=Maksim Mamchur,SEED_DEMO_DATA=false'
          --update-secrets='JWT_SECRET=jwt-secret:latest,SENDPULSE_ID=sendpulse-id:latest,SENDPULSE_SECRET=sendpulse-secret:latest'
          --remove-env-vars=APP_DEMO_TOKEN
      - name: Deploy web
        run: >-
          gcloud run deploy agentic-video-studio-web
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --region=us-central1
          --no-invoker-iam-check
          --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/web:${{ github.sha }}
          --remove-env-vars=NUXT_PUBLIC_DEMO_TOKEN
      - name: Verify rollout
        run: |
          curl --fail --silent --show-error '${{ secrets.PRODUCTION_API_URL }}/v1/health'
          curl --fail --silent --show-error '${{ secrets.PRODUCTION_WEB_URL }}/' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' '${{ secrets.PRODUCTION_API_URL }}/v1/projects')" = "401"
