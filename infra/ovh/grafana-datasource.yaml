apiVersion: 1

datasources:
  - name: Agentic Video Studio ClickHouse
    uid: avs-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 8080
      protocol: http
      secure: false
      username: avs
      defaultDatabase: default
      dialTimeout: 10
      queryTimeout: 30
      validateSql: true
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
