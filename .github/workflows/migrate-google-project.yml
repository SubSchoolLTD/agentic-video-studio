name: Migrate Google Cloud project

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-project-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OLD_PROJECT_ID: subschool-484119
      NEW_PROJECT_ID: ${{ secrets.NEW_GCP_PROJECT_ID }}
      REGION: us-central1
      OLD_MEDIA_BUCKET: subschool-484119-avs-media
      DB_EXPORT_OBJECT: migration/account-switch-20260809.sql.gz

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.OLD_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.OLD_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Collect secrets, database export, and media from the old project
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_dir="$RUNNER_TEMP/avs-secrets"
          media_dir="$RUNNER_TEMP/avs-media"
          mkdir -p "$secret_dir" "$media_dir"

          secrets=(
            api-key-pepper
            app-demo-token
            clickhouse-password
            cloud-sql-password
            google-api-key
            grafana-admin-password
            parallel-api-key
            secret-encryption-key
            webhook-signing-secret
            youtube-client-id
            youtube-client-secret
            youtube-refresh-token
          )
          for secret in "${secrets[@]}"; do
            gcloud secrets versions access latest \
              --project="$OLD_PROJECT_ID" \
              --secret="$secret" > "$secret_dir/$secret"
          done

          gcloud storage rsync \
            "gs://$OLD_MEDIA_BUCKET" \
            "$media_dir" \
            --recursive
          test -s "$media_dir/$DB_EXPORT_OBJECT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.NEW_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.NEW_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Prepare remote Terraform state
        shell: bash
        run: |
          set -euo pipefail
          state_bucket="gs://${NEW_PROJECT_ID}-avs-tfstate"
          if ! gcloud storage buckets describe "$state_bucket" >/dev/null 2>&1; then
            gcloud storage buckets create "$state_bucket" \
              --project="$NEW_PROJECT_ID" \
              --location="$REGION" \
              --uniform-bucket-level-access \
              --public-access-prevention
          fi
          gcloud storage buckets update "$state_bucket" --versioning

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"

      - name: Resolve stable service URLs
        shell: bash
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "$NEW_PROJECT_ID" --format='value(projectNumber)')"
          {
            echo "PROJECT_NUMBER=$project_number"
            echo "NEW_API_URL=https://agentic-video-studio-api-${project_number}.${REGION}.run.app"
            echo "NEW_WEB_URL=https://agentic-video-studio-web-${project_number}.${REGION}.run.app"
          } >> "$GITHUB_ENV"

      - name: Create foundation resources
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_sql_user_password TF_VAR_project_id TF_VAR_github_repository
          export TF_VAR_app_base_url TF_VAR_web_base_url
          TF_VAR_sql_user_password="$(<"$RUNNER_TEMP/avs-secrets/cloud-sql-password")"
          TF_VAR_project_id="$NEW_PROJECT_ID"
          TF_VAR_github_repository="SubSchool/agentic-video-studio"
          TF_VAR_app_base_url="$NEW_API_URL"
          TF_VAR_web_base_url="$NEW_WEB_URL"

          terraform -chdir=infra/terraform init \
            -backend-config="bucket=${NEW_PROJECT_ID}-avs-tfstate" \
            -backend-config="prefix=agentic-video-studio/prod"

          if gcloud sql instances describe avs-postgres \
            --project="$NEW_PROJECT_ID" >/dev/null 2>&1; then
            if ! terraform -chdir=infra/terraform state show \
              google_sql_database_instance.postgres >/dev/null 2>&1; then
              terraform -chdir=infra/terraform import \
                google_sql_database_instance.postgres \
                "projects/${NEW_PROJECT_ID}/instances/avs-postgres"
            fi

            sql_state=""
            for _ in $(seq 1 90); do
              sql_state="$(gcloud sql instances describe avs-postgres \
                --project="$NEW_PROJECT_ID" \
                --format='value(state)')"
              if [[ "$sql_state" == "RUNNABLE" ]]; then
                break
              fi
              sleep 10
            done
            if [[ "$sql_state" != "RUNNABLE" ]]; then
              echo "Cloud SQL did not become RUNNABLE; last state: $sql_state" >&2
              exit 1
            fi
          fi

          terraform -chdir=infra/terraform apply -auto-approve \
            -var="deploy_runtime_services=false"

      - name: Restore media, database, and runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$RUNNER_TEMP/avs-secrets"
          media_dir="$RUNNER_TEMP/avs-media"
          new_media_bucket="${NEW_PROJECT_ID}-avs-media"

          gcloud storage rsync \
            "$media_dir" \
            "gs://$new_media_bucket" \
            --recursive

          gcloud sql import sql avs-postgres \
            "gs://$new_media_bucket/$DB_EXPORT_OBJECT" \
            --database=agentic_video_studio \
            --project="$NEW_PROJECT_ID" \
            --quiet

          connection_name="$(gcloud sql instances describe avs-postgres \
            --project="$NEW_PROJECT_ID" \
            --format='value(connectionName)')"
          SECRET_DIR="$secret_dir" CONNECTION_NAME="$connection_name" python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          secret_dir = Path(os.environ["SECRET_DIR"])
          password = (secret_dir / "cloud-sql-password").read_text().strip()
          connection_name = os.environ["CONNECTION_NAME"]
          database_url = (
              f"postgresql+psycopg://avs_app:{quote(password, safe='')}"
              f"@/agentic_video_studio?host=/cloudsql/{connection_name}"
          )
          (secret_dir / "database-url").write_text(database_url)
          PY

          for secret_file in "$secret_dir"/*; do
            secret="$(basename "$secret_file")"
            gcloud secrets versions add "$secret" \
              --project="$NEW_PROJECT_ID" \
              --data-file="$secret_file"
          done

      - name: Build immutable runtime images
        shell: bash
        run: |
          set -euo pipefail
          image_root="${REGION}-docker.pkg.dev/${NEW_PROJECT_ID}/agentic-video-studio"
          source_bucket="gs://${NEW_PROJECT_ID}-avs-build-source/source"

          gcloud builds submit . \
            --project="$NEW_PROJECT_ID" \
            --config=infra/cloudbuild-api.yaml \
            --gcs-source-staging-dir="$source_bucket" \
            --substitutions="_IMAGE=${image_root}/api:${GITHUB_SHA}"
          gcloud builds submit . \
            --project="$NEW_PROJECT_ID" \
            --config=infra/cloudbuild-web.yaml \
            --gcs-source-staging-dir="$source_bucket" \
            --substitutions="_IMAGE=${image_root}/web:${GITHUB_SHA}"
          gcloud builds submit . \
            --project="$NEW_PROJECT_ID" \
            --config=infra/cloudbuild-clickhouse.yaml \
            --gcs-source-staging-dir="$source_bucket" \
            --substitutions="_IMAGE=${image_root}/clickhouse:${GITHUB_SHA}"
          gcloud builds submit . \
            --project="$NEW_PROJECT_ID" \
            --config=infra/cloudbuild-grafana.yaml \
            --gcs-source-staging-dir="$source_bucket" \
            --substitutions="_IMAGE=${image_root}/grafana:${GITHUB_SHA}"

      - name: Deploy runtime services
        shell: bash
        run: |
          set -euo pipefail
          export TF_VAR_sql_user_password
          TF_VAR_sql_user_password="$(<"$RUNNER_TEMP/avs-secrets/cloud-sql-password")"
          image_root="${REGION}-docker.pkg.dev/${NEW_PROJECT_ID}/agentic-video-studio"

          terraform -chdir=infra/terraform apply -auto-approve \
            -var="project_id=$NEW_PROJECT_ID" \
            -var="github_repository=SubSchool/agentic-video-studio" \
            -var="app_base_url=$NEW_API_URL" \
            -var="web_base_url=$NEW_WEB_URL" \
            -var="api_image=${image_root}/api:${GITHUB_SHA}" \
            -var="web_image=${image_root}/web:${GITHUB_SHA}" \
            -var="clickhouse_image=${image_root}/clickhouse:${GITHUB_SHA}" \
            -var="grafana_image=${image_root}/grafana:${GITHUB_SHA}" \
            -var="deploy_runtime_services=true"

      - name: Verify the new production services
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$NEW_API_URL/v1/health"
          curl --fail --silent --show-error "$NEW_WEB_URL/" >/dev/null
          {
            echo "### New Google Cloud production"
            echo "- Project: $NEW_PROJECT_ID"
            echo "- API: $NEW_API_URL"
            echo "- Web: $NEW_WEB_URL"
          } >> "$GITHUB_STEP_SUMMARY"
