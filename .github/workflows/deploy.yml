name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build immutable API image
        run: >-
          gcloud builds submit .
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --config=infra/cloudbuild-api.yaml
          --gcs-source-staging-dir=gs://${{ secrets.GCP_PROJECT_ID }}-avs-build-source/source
          --substitutions=_IMAGE=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/api:${{ github.sha }}
      - name: Build immutable web image
        run: >-
          gcloud builds submit .
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --config=infra/cloudbuild-web.yaml
          --gcs-source-staging-dir=gs://${{ secrets.GCP_PROJECT_ID }}-avs-build-source/source
          --substitutions=_IMAGE=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/web:${{ github.sha }}
      - name: Deploy API and run migrations
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          PRODUCTION_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
        run: |
          set -euo pipefail
          PRODUCTION_API_URL="${PRODUCTION_API_URL%/}"
          PRODUCTION_WEB_URL="${PRODUCTION_WEB_URL%/}"
          secret_bindings='JWT_SECRET=jwt-secret:latest,SENDPULSE_ID=sendpulse-id:latest,SENDPULSE_SECRET=sendpulse-secret:latest,PAYPAL_CLIENT_ID=paypal-client-id:latest,PAYPAL_SECRET=paypal-secret:latest'
          gcloud run deploy agentic-video-studio-api \
            --project="${GCP_PROJECT_ID}" \
            --region=us-central1 \
            --no-invoker-iam-check \
            --concurrency=2 \
            --cpu=2 \
            --memory=4Gi \
            --timeout=3600 \
            --image="us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/agentic-video-studio/api:${{ github.sha }}" \
            --update-env-vars="APP_ENV=production,APP_AUTH_MODE=jwt,APP_BASE_URL=${PRODUCTION_API_URL},MCP_API_BASE=http://127.0.0.1:8080,WEB_BASE_URL=${PRODUCTION_WEB_URL},PROVIDER_MODE=live,PAYPAL_ENV=live,PAYPAL_MIN_TOPUP_USD=12,EMAIL_DELIVERY_MODE=sendpulse,EMAIL_FROM_NAME=Framewise,EMAIL_FROM_EMAIL=maksim@subschool.us,GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }},BOOTSTRAP_ADMIN_EMAIL=maksim@subschool.us,BOOTSTRAP_ADMIN_NAME=Maksim Mamchur,SEED_DEMO_DATA=false,YOUTUBE_REDIRECT_URI=${PRODUCTION_API_URL}/v1/connections/youtube/callback" \
            --update-secrets="${secret_bindings}" \
            --remove-env-vars=APP_DEMO_TOKEN,INSTAGRAM_APP_ID,INSTAGRAM_APP_SECRET,INSTAGRAM_REDIRECT_URI,INSTAGRAM_GRAPH_VERSION,TIKTOK_CLIENT_KEY,TIKTOK_CLIENT_SECRET,TIKTOK_REDIRECT_URI,SOCIAL_BROWSER_SESSION_SECRET
      - name: Deploy web
        run: >-
          gcloud run deploy agentic-video-studio-web
          --project='${{ secrets.GCP_PROJECT_ID }}'
          --region=us-central1
          --no-invoker-iam-check
          --image=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agentic-video-studio/web:${{ github.sha }}
          --update-env-vars=NUXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          --remove-env-vars=NUXT_PUBLIC_DEMO_TOKEN
      - name: Verify rollout
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          PRODUCTION_WEB_URL: ${{ secrets.PRODUCTION_WEB_URL }}
        run: |
          curl --fail --silent --show-error '${{ secrets.PRODUCTION_API_URL }}/v1/health'
          test "$(curl --fail --silent --show-error '${{ secrets.PRODUCTION_API_URL }}/v1/billing/public-pricing' | python -c 'import json,sys; print(json.load(sys.stdin)["minimum_topup_usd"])')" = "12"
          curl --fail --silent --show-error '${{ secrets.PRODUCTION_WEB_URL }}/' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' '${{ secrets.PRODUCTION_API_URL }}/v1/projects')" = "401"
          gcloud run services describe agentic-video-studio-api \
            --project="${GCP_PROJECT_ID}" \
            --region=us-central1 \
            --format=json | python -c 'import json,os,sys; data=json.load(sys.stdin); env={item["name"]:item.get("value") for item in data["spec"]["template"]["spec"]["containers"][0]["env"]}; api=os.environ["PRODUCTION_API_URL"].rstrip("/"); web=os.environ["PRODUCTION_WEB_URL"].rstrip("/"); expected={"APP_BASE_URL":api,"WEB_BASE_URL":web,"YOUTUBE_REDIRECT_URI":f"{api}/v1/connections/youtube/callback"}; wrong={key:(env.get(key),value) for key,value in expected.items() if env.get(key)!=value}; assert not wrong, wrong'
