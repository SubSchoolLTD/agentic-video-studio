main:
  params: [args]
  steps:
    - runDueAutomation:
        call: http.post
        args:
          url: ${args.api_url + "/v1/internal/automation/run-due"}
          auth:
            type: OIDC
            audience: ${args.api_url}
          timeout: 300
        result: automationResponse
    - collectDueMetrics:
        call: http.post
        args:
          url: ${args.api_url + "/v1/internal/metrics/collect-due"}
          auth:
            type: OIDC
            audience: ${args.api_url}
          timeout: 300
        result: collectorResponse
    - returnResult:
        return:
          automation:
            status_code: ${automationResponse.code}
            body: ${automationResponse.body}
          metrics:
            status_code: ${collectorResponse.code}
            body: ${collectorResponse.body}
